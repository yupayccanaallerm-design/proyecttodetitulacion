# Configuración Nginx para travel.tumperusoft.com
# Archivo: /etc/nginx/sites-available/travel.tumperusoft.com
#
# INSTRUCCIONES DE DEPLOY:
#   sudo cp nginx.travel.conf /etc/nginx/sites-available/travel.tumperusoft.com
#   sudo ln -sf /etc/nginx/sites-available/travel.tumperusoft.com /etc/nginx/sites-enabled/
#   sudo nginx -t
#   sudo systemctl reload nginx
#
# PUERTO DEL BACKEND: 8001 (FastAPI Travel Assistant)
# NO TOCAR: El servicio OCR independiente NO tiene rutas aquí.

server {
    listen 80;
    server_name travel.tumperusoft.com www.travel.tumperusoft.com;

    # Redirigir todo HTTP → HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name travel.tumperusoft.com www.travel.tumperusoft.com;

    # ─── SSL (Let's Encrypt) ───────────────────────────────────────────────────
    ssl_certificate     /etc/letsencrypt/live/travel.tumperusoft.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/travel.tumperusoft.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # ─── Parámetros globales ───────────────────────────────────────────────────
    client_max_body_size 20M;

    # ─── FRONTEND (React build estático) ──────────────────────────────────────
    # Ajusta esta ruta al directorio donde hiciste: npm run build
    root /var/www/travel/frontend/dist;
    index index.html;

    # SPA fallback: rutas del React Router (no devuelve 404 en refresh)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ─── BACKEND: /api/* ──────────────────────────────────────────────────────
    # Tours, Paquetes, Reservas, Login, Usuarios, Clientes
    location /api/ {
        proxy_pass         http://127.0.0.1:8001/api/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
    }

    # ─── BACKEND: /chatbot/* ──────────────────────────────────────────────────
    # Chatbot RAG, memoria, reconocimiento de imágenes, upload PDF
    location /chatbot/ {
        proxy_pass         http://127.0.0.1:8001/chatbot/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        # Timeout largo: Ollama puede tardar en responder
        proxy_read_timeout 300s;
        proxy_connect_timeout 10s;
    }

    # ─── BACKEND: /recomendar ─────────────────────────────────────────────────
    # Recomendador ML (RandomForest)
    # IMPORTANTE: sin trailing slash — el router FastAPI registra /recomendar (no /recomendar/)
    location /recomendar {
        proxy_pass         http://127.0.0.1:8001/recomendar;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }

    # ─── BACKEND: /vision/* ───────────────────────────────────────────────────
    # Reconocimiento de imágenes (Keras)
    location /vision/ {
        proxy_pass         http://127.0.0.1:8001/vision/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
        client_max_body_size 10M;
    }

    # ─── Health check ─────────────────────────────────────────────────────────
    location /health {
        proxy_pass http://127.0.0.1:8001/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }
}
