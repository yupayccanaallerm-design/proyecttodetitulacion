# ══════════════════════════════════════════════════════════════════
#  Nginx — travel.tumperusoft.com  (Hostinger VPS)
#  Backend FastAPI en puerto 8000
# ══════════════════════════════════════════════════════════════════
#
#  COPIAR EN EL SERVIDOR:
#    sudo cp /root/proyecttodetitulacion/nginx.travel.conf \
#            /etc/nginx/sites-available/travel.tumperusoft.com
#    sudo ln -sf /etc/nginx/sites-available/travel.tumperusoft.com \
#                /etc/nginx/sites-enabled/travel.tumperusoft.com
#    sudo nginx -t && sudo systemctl reload nginx

# ── Redirige HTTP → HTTPS ──────────────────────────────────────────
server {
    listen 80;
    server_name travel.tumperusoft.com www.travel.tumperusoft.com;
    return 301 https://$host$request_uri;
}

# ── HTTPS principal ────────────────────────────────────────────────
server {
    listen 443 ssl http2;
    server_name travel.tumperusoft.com www.travel.tumperusoft.com;

    # SSL — Let's Encrypt
    ssl_certificate     /etc/letsencrypt/live/travel.tumperusoft.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/travel.tumperusoft.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # Tamaño máximo de upload (fotos, PDFs)
    client_max_body_size 20M;

    # ── FRONTEND React (archivos estáticos del build) ──────────────
    root  /root/proyecttodetitulacion/frontend/dist;
    index index.html;

    # SPA: cualquier ruta desconocida devuelve index.html
    # (necesario para que React Router funcione al recargar)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── /api/  →  FastAPI puerto 8000 ─────────────────────────────
    # Tours, Paquetes, Reservas, Login, Usuarios, Clientes
    location /api/ {
        proxy_pass         http://127.0.0.1:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
    }

    # ── /chatbot/  →  FastAPI puerto 8000 ─────────────────────────
    # Chatbot RAG + memoria SQLite + reconocimiento de imagen + PDF
    # Timeout largo porque Ollama puede tardar 30-120 s en responder
    location /chatbot/ {
        proxy_pass         http://127.0.0.1:8000/chatbot/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_connect_timeout 10s;
        client_max_body_size 10M;
    }

    # ── /recomendar  →  FastAPI puerto 8000 ───────────────────────
    # Recomendador ML (RandomForest). Sin trailing slash: el router
    # de FastAPI registra exactamente /recomendar y /recomendar/status
    location /recomendar {
        proxy_pass         http://127.0.0.1:8000/recomendar;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }

    # ── /vision/  →  FastAPI puerto 8000 ──────────────────────────
    # Reconocimiento de imágenes (Keras)
    location /vision/ {
        proxy_pass         http://127.0.0.1:8000/vision/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
        client_max_body_size 10M;
    }

    # ── /health  →  FastAPI puerto 8000 ───────────────────────────
    location /health {
        proxy_pass         http://127.0.0.1:8000/health;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_read_timeout 10s;
    }
}
