<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MotoHelper - Chatbot Taller</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="wrap">
    <header class="top">
      <div class="brand">
        <span class="logo" aria-label="Logo Moto">🏍️</span>
        <div class="titles">
          <h1>MotoHelper</h1>
          <p class="muted">Asistente de taller de motos</p>
        </div>
      </div>
    </header>

    <main class="grid">
      <!-- Chat -->
      <section class="chat" id="chat" aria-live="polite"></section>

      <!-- Panel de interacción -->
      <section class="panel">
        <div class="row">
          <input id="textInput" type="text" placeholder="Pregunta sobre motos o repuestos..." aria-label="Pregunta al bot" />
          <button id="sendBtn" class="btn">Enviar</button>
        </div>
        <div class="row">
          <button id="micBtn" class="btn mic" title="Mantén para hablar. Clic para activar/desactivar micrófono.">🎙️ Hablar</button>
          <span id="asrStatus" class="status">Micrófono inactivo</span>
        </div>
        <div class="tips">
          <p>💡 Pregunta sobre motos, diagnósticos, repuestos o servicios del taller.</p>
        </div>
      </section>
    </main>

    <footer class="foot">
      <small class="muted">MotoHelper AI®</small>
    </footer>
  </div>

  <script src="script.js"></script>
</body>
</html>
